name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          for script in sbctl.sh deploy.sh lib/*.sh tests/*.sh; do bash -n "$script"; done

      - name: ShellCheck
        run: shellcheck -S warning sbctl.sh deploy.sh lib/*.sh tests/*.sh

      - name: Python compile & unit tests
        run: |
          python3 -m py_compile lib/*.py tests/test_config_gen.py
          python3 -m unittest discover -s tests -v

      - name: Installer and firewall failure regressions
        run: |
          bash tests/test_install_safety.sh
          bash tests/test_firewall_lifecycle.sh

      - name: Concurrent deployment, read-only commands and interrupted sync
        run: |
          bash tests/test_deploy_concurrency.sh
          bash tests/test_command_dispatch.sh
          sudo bash tests/test_sync_transaction.sh

      - name: Route update failure and rollback regressions
        run: bash tests/test_route_transaction.sh

  linux-lifecycle:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        sing_box_version:
          - "1.13.14"
          - "1.14.4"
    steps:
      - uses: actions/checkout@v4

      - name: Check out the verified v0.2.2 installer for the upgrade test
        uses: actions/checkout@v4
        with:
          ref: 82f1b74e6d669b23539b95cfd1f4ad63cbc49630
          path: .ci-v022
          persist-credentials: false

      - name: Install kernel firewall and service test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nftables iproute2 logrotate

      - name: Install, sync the live toolkit, validate all protocols and uninstall
        run: sudo bash tests/linux_lifecycle.sh "${{ matrix.sing_box_version }}"

      - name: Upgrade v0.2.2, update rules, roll back a failed migration and uninstall
        run: sudo bash tests/linux_route_upgrade.sh "${{ matrix.sing_box_version }}" "$GITHUB_WORKSPACE/.ci-v022"
